          grep -n "TARGETED_DEVICE_FAMILY" "$PBX" || true
          # 書き換えに失敗してiPad対応のまま提出してしまうのを防ぐ
          if grep -qE 'TARGETED_DEVICE_FAMILY = "?[0-9]*,2"?;|TARGETED_DEVICE_FAMILY = 2;' "$PBX"; then
            echo "❌ iPad対応の設定が残っています。上の grep の結果を確認してください。"
            exit 1
          fi
          if ! grep -q "TARGETED_DEVICE_FAMILY = 1;" "$PBX"; then
            echo "❌ iPhone専用の設定(TARGETED_DEVICE_FAMILY = 1)が見つかりません。"
            exit 1
          fi
          echo "✅ iPhone専用に設定しました"
      - name: Info.plistに広告・暗号化の設定を追加(毎回自動生成されるため)
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string ca-app-pub-4044413836429156~5152450361" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier ca-app-pub-4044413836429156~5152450361" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string 'あなたに合った広告を表示するために、この許可が使用されます。'" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :NSUserTrackingUsageDescription 'あなたに合った広告を表示するために、この許可が使用されます。'" "$PLIST"
          # 輸出コンプライアンス(暗号化)の質問を毎回聞かれないようにする(標準的なHTTPS通信のみ)
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
      - name: Push通知の権限を追加(Push Notifications と Background Modes > Remote notifications。毎回自動生成されるため)
        script: |
          APP_DIR=ios/App/App
          PBX=ios/App/App.xcodeproj/project.pbxproj
          PLIST=$APP_DIR/Info.plist
          ENT=$APP_DIR/App.entitlements

          # 1) entitlementsファイルを作る(本番(TestFlight/App Store)向けは production)
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '	<key>aps-environment</key>' \
            '	<string>production</string>' \
            '</dict>' \
            '</plist>' > "$ENT"
          /usr/libexec/PlistBuddy -c "Print" "$ENT"

          # 2) Xcodeプロジェクトに、そのentitlementsを使うよう設定する(Debug/Releaseの両方)
          if ! grep -q "CODE_SIGN_ENTITLEMENTS" "$PBX"; then
            perl -pi -e 's/^(\s+)(ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;)/$1$2\n$1CODE_SIGN_ENTITLEMENTS = App\/App.entitlements;/' "$PBX"
          fi
          grep -n "CODE_SIGN_ENTITLEMENTS" "$PBX" || true
          if ! grep -q "CODE_SIGN_ENTITLEMENTS = App/App.entitlements;" "$PBX"; then
            echo "❌ entitlementsの設定を追加できませんでした。上の grep の結果を確認してください。"
            exit 1
          fi

          # 3) Background Modes > Remote notifications
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          echo "✅ Push通知の権限を追加しました"
      - name: アプリアイコンを差し替え(1024x1024・透明なしのPNG。毎回自動生成されるため)
        script: |
          # アイコン画像は、リポジトリの resources/AppIcon-1024.png に置く。
          # App Storeの条件: 1024x1024 / 透明(アルファ)なし / 角丸なし(角丸はAppleが自動でかける)
          ICON_SRC="resources/AppIcon-1024.png"
          ICON_DST="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          if [ ! -f "$ICON_SRC" ]; then
            echo "⚠️ $ICON_SRC がありません。Capacitor標準のアイコンのままビルドします。"
            echo "   App Storeに提出する前に、resources フォルダにアイコンを置いてください。"
          else
            W=$(sips -g pixelWidth "$ICON_SRC" | awk '/pixelWidth/{print $2}')
            H=$(sips -g pixelHeight "$ICON_SRC" | awk '/pixelHeight/{print $2}')
            A=$(sips -g hasAlpha "$ICON_SRC" | awk '/hasAlpha/{print $2}')
            echo "アイコン画像: ${W}x${H} / 透明チャンネル: ${A}"
            if [ "$W" != "1024" ] || [ "$H" != "1024" ]; then
              echo "❌ アイコンは 1024x1024 のPNGにしてください(今: ${W}x${H})"
              exit 1
            fi
            if [ "$A" = "yes" ]; then
              echo "❌ アイコンに透明(アルファ)チャンネルがあります。App Storeは受け付けません。"
              echo "   背景を塗りつぶして、透明なしで書き出してください。"
              exit 1
            fi
            cp "$ICON_SRC" "$ICON_DST"
            echo "✅ アプリアイコンを差し替えました: $ICON_DST"
          fi
      - name: ビルド番号をCodemagicの連番に設定(TestFlightは毎回増える番号が必要)
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
      - name: 証明書の秘密鍵が読み込めているか確認(中身は表示しません)
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "❌ CERTIFICATE_PRIVATE_KEY が空です。Codemagicの Environment variables で、"
            echo "   名前・グループ名(code-signing)・保存の有無を確認してください。"
            exit 1
          fi
          echo "✅ CERTIFICATE_PRIVATE_KEY を読み込めました(文字数: ${#CERTIFICATE_PRIVATE_KEY})"
          case "$CERTIFICATE_PRIVATE_KEY" in
            *"BEGIN RSA PRIVATE KEY"*) echo "✅ 形式OK(RSA PRIVATE KEY)";;
            *) echo "⚠️ 先頭が「-----BEGIN RSA PRIVATE KEY-----」ではありません。コピーし直してください。";;
          esac
      - name: 署名用のキーチェーンを準備
        script: |
          keychain initialize
      - name: 証明書とプロビジョニングプロファイルをAppleから取得(無ければ自動で作成)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: 取得した証明書をキーチェーンに追加
        script: |
          keychain add-certificates
      - name: 署名設定をXcodeプロジェクトに反映
        script: |
          xcode-project use-profiles
      - name: 署名つきの.ipaをビルド
        script: |
          # Capacitor 8 は CocoaPods ではなく Swift Package Manager を使うため、
          # .xcworkspace が無い場合は .xcodeproj を直接ビルドする。
          if [ -d "$XCODE_WORKSPACE" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa \
              --project "$XCODE_PROJECT" \
              --scheme "$XCODE_SCHEME"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
