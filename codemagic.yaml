workflows:
  ios-simulator-test:
    name: iOS Simulator Build (署名なし・動作確認用)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: npmで必要な部品をインストール
        script: |
          npm install
      - name: Capacitorのbridgeをビルド & wwwを最新化
        script: |
          npm run sync
      - name: iOSプロジェクトを生成(まだ無ければ)
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap copy ios
          fi
      - name: CocoaPodsの依存関係をインストール
        script: |
          cd ios/App && pod install
      - name: シミュレーター用にビルド(署名不要)
        script: |
          cd ios/App && xcodebuild -workspace $XCODE_WORKSPACE \
            -scheme $XCODE_SCHEME \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            build
    artifacts:
      - ios/App/build/**/*.app
